apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-agent
subjects:
  - kind: ServiceAccount
    name: log-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-agent
