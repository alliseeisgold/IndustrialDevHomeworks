apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: custom-app
      component: deployment
  template:
    metadata:
      labels:
        app: custom-app
        component: deployment
    spec:
      containers:
        - name: custom-app
          image: custom-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: custom-app-config
