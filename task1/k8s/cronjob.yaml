apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-archive
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-archive
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-archive
subjects:
  - kind: ServiceAccount
    name: log-archive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-archive
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-archive
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: log-archive
          restartPolicy: OnFailure
          containers:
            - name: log-archive
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  mkdir -p /app/logs

                  endpoints=$(kubectl get endpoints custom-app-service -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{"\n"}{end}')

                  for ip in $endpoints; do
                    curl -fsS "http://${ip}:8080/logs" -o "/app/logs/${ip}.log" || true
                  done

                  timestamp=$(date +%Y%m%d-%H%M%S)
                  archive="/tmp/app-logs-${timestamp}.tar.gz"

                  tar -czf "$archive" /app/logs/

                  echo "archive created: $archive"
                  ls -l "$archive"
                  find /app/logs -maxdepth 1 -type f | sort
              volumeMounts:
                - name: logs
                  mountPath: /app/logs
          volumes:
            - name: logs
              emptyDir: {}
